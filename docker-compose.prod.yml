services:
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      lab_default:
        aliases:
          - redis
          - lab-redis

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:secret@lab-db-1:5432/todo_crud_learner
      - REDIS_URL=redis://lab-redis:6379/0
      - KEYCLOAK_SERVER_URL=http://192.168.1.3:8080
      - KEYCLOAK_REALM=todo-realm
      - KEYCLOAK_CLIENT_ID=todo-app
      - SECRET_KEY=homelab_production_secret_key_123
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW_SECONDS=60
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
      - S3_BUCKET_NAME=todo-attachments
    ports:
      - "8000:8000"
    networks:
      lab_default:
        aliases:
          - backend
          - lab-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_KEYCLOAK_URL=http://192.168.1.3:8080
        - NEXT_PUBLIC_KEYCLOAK_REALM=todo-realm
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=todo-app
        - NEXT_PUBLIC_API_URL=http://192.168.1.3/api/v1
    container_name: lab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      lab_default:
        aliases:
          - frontend
          - lab-frontend
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    container_name: lab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      lab_default:
        aliases:
          - minio
          - lab-minio

networks:
  lab_default:
    external: true

volumes:
  minio_data:

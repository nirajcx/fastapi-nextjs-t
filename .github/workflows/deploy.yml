name: Deploy homelab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy on homelab
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    env:
      DAYMARK_PROD_ENV: ${{ vars.DAYMARK_PROD_ENV }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify services
        run: bash deploy/scripts/deploy.sh

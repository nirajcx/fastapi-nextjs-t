name: ${COMPOSE_PROJECT_NAME:-fastapi-nextjs-t}

services:
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      lab_default:
        aliases:
          - redis
          - lab-redis

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lab-backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the production env file}
      - REDIS_URL=redis://lab-redis:6379/0
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      - KEYCLOAK_REALM=todo-realm
      - KEYCLOAK_CLIENT_ID=todo-app
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - RATE_LIMIT_REQUESTS=60
      - RATE_LIMIT_WINDOW_SECONDS=60
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      - S3_BUCKET_NAME=todo-attachments
    ports:
      - "8000:8000"
    networks:
      lab_default:
        aliases:
          - backend
          - lab-backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
        - NEXT_PUBLIC_KEYCLOAK_REALM=todo-realm
        - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=todo-app
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: lab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      lab_default:
        aliases:
          - frontend
          - lab-frontend
    depends_on:
      - backend

  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    container_name: lab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      lab_default:
        aliases:
          - minio
          - lab-minio

networks:
  lab_default:
    external: true
    name: ${HOMELAB_NETWORK:-lab_default}

volumes:
  minio_data:

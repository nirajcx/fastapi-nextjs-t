name: daymark-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo_dev_password
      POSTGRES_DB: todo_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/dev-realm.json:/opt/keycloak/data/import/todo-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\r\n\r\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  minio:
    build:
      context: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
    command: sh -c 'alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload'
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://todo:todo_dev_password@postgres:5432/todo_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-only-do-not-use-in-production
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: todo-realm
      KEYCLOAK_CLIENT_ID: todo-app
      RATE_LIMIT_REQUESTS: 300
      RATE_LIMIT_WINDOW_SECONDS: 60
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: minio_dev_password
      S3_BUCKET_NAME: todo-attachments
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert r.get('status') == 'ok' and r.get('db') == 'healthy'"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    command: sh -c 'npm ci && exec npm run dev -- --hostname 0.0.0.0'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: todo-realm
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: todo-app
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
  minio_data:
  frontend_modules:
  frontend_next:
